plugins {
    id 'com.android.application'
}

def releaseKeystore = System.getenv('BATTERY_RELAY_RELEASE_KEYSTORE')
def releaseStorePassword = System.getenv('BATTERY_RELAY_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('BATTERY_RELAY_KEY_ALIAS')
def releaseKeyPassword = System.getenv('BATTERY_RELAY_KEY_PASSWORD')
def releaseSigningReady = releaseKeystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'jp.rstlab.batteryrelay'
    compileSdk 36

    defaultConfig {
        applicationId 'jp.rstlab.batteryrelay'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '1.3.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile rootProject.file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // Java 8 bytecode keeps the APK broadly compatible and avoids adding
        // any runtime dependency for language features the app does not use.
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        // API 36 is intentional: AGP 8.13's supported maximum. ACCESS_LOCAL_NETWORK is declared
        // now so the manifest is ready for Android 17; runtime requesting is required when the
        // project eventually moves targetSdk to 37+.
        disable 'GradleDependency', 'OldTargetApi'
    }

    testOptions {
        animationsDisabled true
    }
}

// Never silently mint a new "release" identity. A release package must use the long-lived key
// supplied by the operator, otherwise Android correctly refuses it as an update to prior builds.
tasks.configureEach { task ->
    if (task.name.toLowerCase().matches('.*(assemble|bundle|package).*release.*')) {
        task.doFirst {
            if (!releaseSigningReady) {
                throw new GradleException('Release signing is not configured. Set BATTERY_RELAY_RELEASE_KEYSTORE, BATTERY_RELAY_STORE_PASSWORD, BATTERY_RELAY_KEY_ALIAS and BATTERY_RELAY_KEY_PASSWORD.')
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
