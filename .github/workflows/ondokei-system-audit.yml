name: ONDOKEI full system audit

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ondokei-audit-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-static-audit:
    name: Build, unit tests, lint and APK audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore executable bits
        run: chmod +x gradlew scripts/ci/*.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36 build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Create ephemeral CI release identity
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/ondokei-ci-release.jks" \
            -storepass ci-audit-pass -keypass ci-audit-pass \
            -alias ci-audit -keyalg RSA -keysize 3072 -validity 2 \
            -dname 'CN=ONDOKEI CI Audit,O=RST Lab,C=JP'
          {
            echo "BATTERY_RELAY_RELEASE_KEYSTORE=$RUNNER_TEMP/ondokei-ci-release.jks"
            echo 'BATTERY_RELAY_STORE_PASSWORD=ci-audit-pass'
            echo 'BATTERY_RELAY_KEY_ALIAS=ci-audit'
            echo 'BATTERY_RELAY_KEY_PASSWORD=ci-audit-pass'
          } >> "$GITHUB_ENV"
      - name: Unit tests, lint, debug/release APK and test APK build
        run: ./gradlew --stacktrace testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease assembleDebugAndroidTest
      - name: Verify debug APK structure, signature, manifest, permissions and SDK levels
        run: bash scripts/ci/apk-audit.sh app/build/outputs/apk/debug/app-debug.apk artifacts/static-audit-debug jp.rstlab.batteryrelay.debug
      - name: Verify release-path APK with disposable CI key
        run: bash scripts/ci/apk-audit.sh app/build/outputs/apk/release/app-release.apk artifacts/static-audit-release jp.rstlab.batteryrelay
      - name: Record exact verified revision
        run: |
          mkdir -p artifacts/verification
          printf '%s\n' "$GITHUB_SHA" | tee artifacts/verification/commit-sha.txt
          printf '%s\n' "${GITHUB_REF_NAME:-unknown}" | tee artifacts/verification/ref-name.txt
      - name: Collect reports
        if: always()
        run: |
          mkdir -p artifacts/gradle-reports artifacts/apks
          cp -R app/build/reports/. artifacts/gradle-reports/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/apks/ 2>/dev/null || true
          cp app/build/outputs/apk/release/app-release.apk artifacts/apks/app-ci-release-test-key.apk 2>/dev/null || true
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk artifacts/apks/ 2>/dev/null || true
      - name: Upload build and static audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ondokei-build-static-audit
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  emulator-system-audit:
    name: Emulator API ${{ matrix.api-level }} system audit
    needs: build-and-static-audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: ${{ fromJSON((github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '[26,30,34,35,36]' || '[35]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ondokei-build-static-audit
          path: downloaded
      - name: Restore executable bits
        run: chmod +x scripts/ci/*.sh
      - name: Enable hardware acceleration for the Android Emulator
        run: |
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Cache emulator AVD
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ondokei-avd-${{ matrix.api-level }}-google-apis-x86-64-v1
      - name: Run instrumentation/UI and hostile lifecycle scenarios
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disk-size: 4096M
          heap-size: 768M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: scripts/ci/run-emulator-audit.sh ${{ matrix.api-level }} downloaded/apks/app-debug.apk downloaded/apks/app-debug-androidTest.apk artifacts/api-${{ matrix.api-level }}
      - name: Confirm failure diagnostics were collected before emulator shutdown
        if: always()
        run: |
          mkdir -p artifacts/api-${{ matrix.api-level }}/final
          if [ ! -s artifacts/api-${{ matrix.api-level }}/final/logcat.txt ]; then
            printf '%s\n' 'Emulator stopped before logcat could be collected.' \
              > artifacts/api-${{ matrix.api-level }}/final/collection-note.txt
          fi
      - name: Upload API ${{ matrix.api-level }} audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ondokei-emulator-api-${{ matrix.api-level }}
          path: artifacts/api-${{ matrix.api-level }}/
          if-no-files-found: warn
          retention-days: 14
